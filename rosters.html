<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosters | WWE 2K Universe Tracker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #09090b;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    padding: 25px 45px;
    border-bottom: 1px solid #29292d;
    background: radial-gradient(
        ellipse at 50% 100%,
        rgba(190,0,0,.45),
        transparent 65%
    );
}

.header {
    max-width: 1450px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.logo {
    display: flex;
    align-items: center;
    white-space: nowrap;
}

.logo-wwe {
    font-size: 38px;
    font-weight: 900;
    font-style: italic;
}

.logo-2k {
    font-size: 38px;
    font-weight: 900;
    font-style: italic;
    color: #e30613;
    margin-left: 6px;
}

.logo-universe {
    font-size: 28px;
    font-weight: 900;
    margin-left: 7px;
}

.logo-sub {
    position: absolute;
    margin: 47px 0 0 125px;
    font-size: 9px;
    letter-spacing: 6px;
    color: #aaa;
}

nav {
    display: flex;
    align-items: center;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 800;
}

nav a:hover {
    color: #e30613;
}

.season {
    border-left: 3px solid white;
    padding-left: 18px;
    text-align: center;
}

.season-name {
    display: block;
    color: #e30613;
    font-size: 14px;
    font-weight: 900;
}

.season-year {
    display: block;
    font-size: 20px;
    font-weight: 900;
}

main {
    max-width: 1400px;
    margin: auto;
    padding: 45px;
}

.title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
}

.title-bar {
    width: 9px;
    height: 40px;
    background: #e30613;
}

.title h1 {
    font-size: 38px;
    font-weight: 900;
}

.rosters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.roster {
    display: block;
    height: 300px;
    overflow: hidden;
    border-radius: 15px;
    border: 1px solid #29292d;
}

.roster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
}

.roster:hover img {
    transform: scale(1.04);
}

footer {
    border-top: 1px solid #29292d;
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 10px;
    letter-spacing: 2px;
}

@media(max-width: 1000px) {
    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    nav {
        flex-wrap: wrap;
    }
}

@media(max-width: 700px) {
    main {
        padding: 25px;
    }

    .rosters {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="header">

        <div class="logo">
            <span class="logo-wwe">WWE</span>
            <span class="logo-2k">2K</span>
            <span class="logo-universe">UNIVERSE</span>
            <span class="logo-sub">TRACKER</span>
        </div>

        <nav>
            <a href="index.html">HOME</a>
            <a href="rosters.html">ROSTERS</a>
            <a href="#">CHAMPIONSHIPS</a>
            <a href="#">EVENTS</a>
            <a href="#">CALENDAR</a>
            <a href="#">STATS</a>

            <div class="season">
                <span class="season-name">SEASON 1</span>
                <span class="season-year">2026</span>
            </div>
        </nav>

    </div>
</header>

<main>

    <div class="title">
        <div class="title-bar"></div>
        <h1>ROSTERS</h1>
    </div>

    <div class="rosters">

        <a class="roster" href="raw.html">
            <img src="assets/raw.jpg" alt="RAW">
        </a>

        <a class="roster" href="nxt.html"">
            <img src="assets/nxt.webp" alt="NXT">
        </a>

        <a class="roster" href="smackdown.html">
            <img src="assets/smackdown.jpg" alt="SmackDown">
        </a>

        <a class="roster" href="aaa.html">
            <img src="assets/aaa.jpg" alt="AAA">
        </a>

    </div>

</main>

<footer>
    WWE 2K UNIVERSE TRACKER • SEASON 1 • 2026
</footer>

</body>
</html>
