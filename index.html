<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WWE 2K Universe Tracker</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    height: 145px;
    padding: 0 45px;
    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        radial-gradient(
            ellipse at center,
            rgba(215,25,32,0.38) 0%,
            rgba(215,25,32,0.15) 35%,
            rgba(8,8,8,0) 70%
        ),
        #080808;

    border-bottom: 1px solid #222;
    box-shadow: 0 8px 35px rgba(215,25,32,0.25);
}

/* LOGO */

.logo {
    font-weight: 900;
    font-size: 28px;
    line-height: 0.9;
    width: 360px;
}

.logo span {
    display: block;
    font-size: 12px;
    letter-spacing: 9px;
    margin-left: 105px;
    margin-top: 8px;
}

/* NAV */

nav {
    display: flex;
    gap: 25px;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1px;
}

nav a:hover {
    color: #D71920;
}

/* SEASON */

.season {
    border-left: 3px solid white;
    padding-left: 28px;
    text-align: center;
    min-width: 120px;
}

.season span {
    display: block;
    color: #D71920;
    font-size: 18px;
    font-weight: 900;
}

.season strong {
    display: block;
    font-size: 17px;
    margin-top: 4px;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1365px;
    margin: 35px auto 70px;
    padding: 0 25px;
}

/* SECTION TITLES */

.section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
}

.section-title::before {
    content: "";
    width: 12px;
    height: 45px;
    background: #D71920;
}

.section-title h2 {
    font-size: 34px;
    font-weight: 900;
}

/* =========================
   BRANDS
========================= */

.brands {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 25px;
}

.brand-card {
    height: 235px;
    border-radius: 16px;
    overflow: hidden;
    display: block;
    transition: transform 0.2s, filter 0.2s;
}

.brand-card:hover {
    transform: translateY(-5px);
    filter: brightness(1.15);
}

.brand-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* =========================
   HOME MODULES
========================= */

.modules {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 45px;
    margin-bottom: 30px;
}

.module {
    display: block;
    text-decoration: none;
    color: white;
}

.module-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
}

.module-title::before {
    content: "";
    width: 12px;
    height: 45px;
    background: #D71920;
}

.module-title h2 {
    font-size: 34px;
    font-weight: 900;
}

/* CARD */

.module-card {
    height: 210px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;

    border: 1px solid #202020;

    background:
        radial-gradient(
            circle at center,
            rgba(215,25,32,0.35),
            transparent 65%
        ),
        linear-gradient(135deg, #151515, #050505);

    transition: transform 0.2s, filter 0.2s;
}

.module:hover .module-card {
    transform: translateY(-5px);
    filter: brightness(1.15);
}

/* MODULE ICON */

.module-icon {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 75px;
    font-weight: 900;

    text-shadow:
        0 0 25px rgba(255,255,255,0.2);
}

/* DIFFERENT MODULE LOOKS */

.draft .module-card {
    background:
        radial-gradient(circle at center,
        rgba(255,255,255,0.7),
        transparent 35%),
        linear-gradient(
            90deg,
            #0879d1,
            #eeeeee,
            #d71920
        );
}

.tournaments .module-card {
    background:
        radial-gradient(circle at center,
        rgba(255,190,70,0.45),
        transparent 45%),
        linear-gradient(135deg,#252525,#080808);
}

.news .module-card {
    background:
        radial-gradient(circle at center,
        rgba(215,25,32,0.45),
        transparent 45%),
        linear-gradient(135deg,#1b1b1b,#050505);
}

.calendar .module-card {
    background:
        radial-gradient(circle at center,
        rgba(20,115,230,0.4),
        transparent 45%),
        linear-gradient(135deg,#161616,#050505);
}

.next-event .module-card {
    background:
        radial-gradient(circle at center,
        rgba(25,164,99,0.35),
        transparent 45%),
        linear-gradient(135deg,#161616,#050505);
}

.next-ple .module-card {
    background:
        radial-gradient(circle at center,
        rgba(123,63,242,0.5),
        transparent 45%),
        linear-gradient(135deg,#171717,#050505);
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 40px;
    color: #555;
    font-size: 12px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {

    header {
        height: auto;
        padding: 25px;
        gap: 25px;
        flex-wrap: wrap;
    }

    .logo {
        width: auto;
    }

    nav {
        order: 3;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    .brands {
        grid-template-columns: repeat(2, 1fr);
    }

    .modules {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {

    .brands {
        grid-template-columns: 1fr;
    }

    .section-title h2,
    .module-title h2 {
        font-size: 27px;
    }
}

</style>
</head>
