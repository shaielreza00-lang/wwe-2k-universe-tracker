<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WWE 2K Universe Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #09090b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */

        header {
            height: 135px;
            padding: 25px 45px 0;
            position: relative;
            background:
                radial-gradient(
                    ellipse at center,
                    rgba(170, 0, 0, 0.55) 0%,
                    rgba(80, 0, 0, 0.25) 35%,
                    rgba(9, 9, 11, 1) 75%
                );
            border-bottom: 1px solid #2a2a2d;
        }

        .header-content {
            height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 370px;
        }

        .wwe {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            line-height: 1;
        }

        .two-k {
            color: #e60012;
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            line-height: 1;
        }

        .universe {
            font-size: 38px;
            font-weight: 900;
            line-height: 1;
        }

        .tracker {
            position: absolute;
            left: 188px;
            top: 73px;
            font-size: 13px;
            letter-spacing: 8px;
            color: #ddd;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
            height: 65px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: #e60012;
        }

        .season {
            height: 65px;
            border-left: 3px solid white;
            padding-left: 25px;
            margin-left: 5px;
            text-align: center;
        }

        .season-title {
            color: #e60012;
            font-size: 19px;
            font-weight: 800;
        }

        .season-year {
            font-size: 25px;
            font-weight: 700;
        }

        /* MAIN */

        main {
            max-width: 1380px;
            margin: auto;
            padding: 40px 45px 80px;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .title-bar {
            width: 12px;
            height: 45px;
            background: #e60012;
        }

        .page-title h1 {
            font-size: 38px;
            font-weight: 900;
        }

        /* ROSTER CARDS */

        .roster-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .roster-card {
            height: 260px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            cursor: pointer;
            border: 1px solid #222;
        }

        .roster-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .roster-card:hover img {
            transform: scale(1.04);
        }

        .roster-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0,0,0,0.35),
                transparent 55%
            );
            pointer-events: none;
        }

        /* FOOTER */

        footer {
            height: 70px;
            border-top: 1px solid #242426;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* MOBILE */

        @media (max-width: 1100px) {

            header {
                height: auto;
                padding: 25px;
            }

            .header-content {
                flex-direction: column;
                gap: 25px;
            }

            .brand-logo {
                min-width: auto;
            }

            .tracker {
                position: static;
                margin-left: 130px;
                margin-top: -25px;
            }

            nav {
                flex-wrap: wrap;
                height: auto;
                padding-bottom: 20px;
            }

            .season {
                display: none;
            }
        }

        @media (max-width: 700px) {

            .roster-grid {
                grid-template-columns: 1fr;
            }

            main {
                padding: 30px 20px 60px;
            }

            .wwe,
            .two-k {
                font-size: 35px;
            }

            .universe {
                font-size: 28px;
            }

            nav a {
                font-size: 16px;
            }

            .roster-card {
                height: 200px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-content">

        <div class="brand-logo">
            <div class="wwe">WWE</div>
            <div class="two-k">2K</div>
            <div class="universe">UNIVERSE</div>
            <div class="tracker">TRACKER</div>
        </div>

        <nav>
            <a href="index.html">HOME</a>
            <a href="#">ROSTERS</a>
            <a href="#">CHAMPIONSHIPS</a>
            <a href="#">EVENTS</a>
            <a href="#">CALENDAR</a>
            <a href="#">STATS</a>

            <div class="season">
                <div class="season-title">SEASON 1</div>
                <div class="season-year">2026</div>
            </div>
        </nav>

    </div>

</header>


<main>

    <div class="page-title">
        <div class="title-bar"></div>
        <h1>ROSTERS</h1>
    </div>

    <div class="roster-grid">

        <div class="roster-card">
            <img src="assets/raw.jpg" alt="RAW">
        </div>

        <div class="roster-card">
            <img src="assets/nxt.webp" alt="NXT">
        </div>

        <div class="roster-card">
            <img src="assets/smackdown.jpg" alt="SmackDown">
        </div>

        <div class="roster-card">
            <img src="assets/aaa.jpg" alt="AAA">
        </div>

    </div>

</main>


<footer>
    WWE 2K UNIVERSE TRACKER • SEASON 1 • 2026
</footer>

</body>
</html>
