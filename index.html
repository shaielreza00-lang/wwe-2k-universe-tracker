<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WWE 2K Universe Tracker</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    height: 145px;
    padding: 0 45px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        radial-gradient(
            ellipse at center,
            rgba(215,25,32,0.38) 0%,
            rgba(215,25,32,0.15) 35%,
            rgba(8,8,8,0) 70%
        ),
        #080808;

    border-bottom: 1px solid #222;

    box-shadow:
        0 8px 35px rgba(215,25,32,0.25);
}

/* LOGO */

.logo {
    width: 360px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo img {
    width: 165px;
    height: auto;
    object-fit: contain;
}

.logo-text {
    display: flex;
    flex-direction: column;
    line-height: 0.85;
}

.logo-text .universe {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo-text .tracker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 7px;
    margin-top: 7px;
    margin-left: 2px;
}

/* NAV */

nav {
    display: flex;
    gap: 25px;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;

    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1px;
}

nav a:hover {
    color: #D71920;
}

/* SEASON */

.season {
    border-left: 3px solid white;
    padding-left: 28px;

    text-align: center;

    min-width: 120px;
}

.season span {
    display: block;

    color: #D71920;

    font-size: 18px;
    font-weight: 900;
}

.season strong {
    display: block;

    font-size: 17px;

    margin-top: 4px;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1365px;

    margin: 35px auto 70px;

    padding: 0 25px;
}

/* =========================
   SECTION TITLES
========================= */

.section-title {
    display: flex;
    align-items: center;

    gap: 10px;

    margin-bottom: 25px;
}

.section-title::before {
    content: "";

    width: 12px;
    height: 45px;

    background: #D71920;
}

.section-title h2 {
    font-size: 34px;
    font-weight: 900;
}

/* =========================
   BRANDS
========================= */

.brands {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 14px;

    margin-bottom: 25px;
}

.brand-card {
    height: 235px;

    border-radius: 16px;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050505;

    border: 1px solid #171717;

    transition:
        transform 0.2s,
        filter 0.2s;
}

.brand-card:hover {
    transform: translateY(-5px);

    filter: brightness(1.15);
}

.brand-card img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;
}

/* =========================
   HOME MODULES
========================= */

.modules {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 45px;

    margin-bottom: 30px;
}

.module {
    display: block;

    text-decoration: none;

    color: white;
}

.module-title {
    display: flex;
    align-items: center;

    gap: 10px;

    margin-bottom: 22px;
}

.module-title::before {
    content: "";

    width: 12px;
    height: 45px;

    background: #D71920;
}

.module-title h2 {
    font-size: 34px;
    font-weight: 900;
}

/* =========================
   MODULE IMAGE
========================= */

.module-card {
    height: 210px;

    border-radius: 16px;

    overflow: hidden;

    position: relative;

    background: #050505;

    border: 1px solid #202020;

    transition:
        transform 0.2s,
        filter 0.2s;
}

.module:hover .module-card {
    transform: translateY(-5px);

    filter: brightness(1.12);
}

.module-card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    padding: 40px;

    color: #555;

    font-size: 12px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1100px) {

    header {
        height: auto;

        padding: 25px;

        gap: 25px;

        flex-wrap: wrap;
    }

    .logo {
        width: auto;
    }

    nav {
        order: 3;

        width: 100%;

        justify-content: center;

        flex-wrap: wrap;
    }

    .brands {
        grid-template-columns: repeat(2, 1fr);
    }

    .modules {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {

    .brands {
        grid-template-columns: 1fr;
    }

    .section-title h2,
    .module-title h2 {
        font-size: 27px;
    }

    .brand-card {
        height: 220px;
    }
}

</style>
</head>
